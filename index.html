<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORE4GLE - Mini Golf</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #2a2a2a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #fff;
        }
        #gameContainer {
            text-align: center;
        }
        canvas {
            border: 3px solid #fff;
            background: linear-gradient(135deg, #90EE90 0%, #228B22 100%);
            display: block;
            margin: 0 auto;
        }
        #info {
            margin-top: 20px;
            font-size: 14px;
        }
        #info p {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <h1>FORE4GLE ⛳</h1>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="info">
            <p><strong>Drag back from the ball and release to shoot (slingshot)</strong></p>
            <p><span id="hole"></span></p>
            <p>Strokes: <span id="strokes">0</span> | Ball Velocity: <span id="velocity">0.0</span></p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game state (ball/cup/strokes/hole are swapped in by loadHole)
        const game = {
            ball: { x: 0, y: 0, vx: 0, vy: 0, radius: 8, friction: 0.98 },
            cup: { x: 0, y: 0, radius: 14 },
            strokes: 0,
            isAiming: false,
            aimPos: null,
            maxPower: 18,
            ballInHole: false,
            hole: 0,
            scores: []
        };

        // Helpers for drawing course walls
        function L(...n) {
            const pts = [];
            for (let i = 0; i < n.length; i += 2) pts.push({ x: n[i], y: n[i + 1] });
            return pts;
        }
        function box(x, y, w, h) {
            return L(x, y, x + w, y, x + w, y + h, x, y + h, x, y);
        }
        function arcPoints(cx, cy, r, a0, a1, n) {
            const pts = [];
            for (let i = 0; i <= n; i++) {
                const a = a0 + (a1 - a0) * i / n;
                pts.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r });
            }
            return pts;
        }
        function waveWall(x0, x1, y, amp, cycles) {
            const pts = [];
            for (let i = 0; i <= 48; i++) {
                const t = i / 48;
                pts.push({ x: x0 + t * (x1 - x0), y: y + Math.sin(t * Math.PI * 2 * cycles) * amp });
            }
            return pts;
        }

        // Hole 1 walls (the original design)
        const archLeft = [
            { x: 140, y: 570 },
            { x: 140, y: 190 },
            ...arcPoints(270, 190, 130, Math.PI, Math.PI * 2, 14),
            { x: 400, y: 430 }
        ];
        // Curve from the top wall sweeping down into the channel divider
        const divider = [
            { x: 520, y: 0 },
            ...arcPoints(520, 95, 95, -Math.PI / 2, -Math.PI, 10),
            { x: 425, y: 430 }
        ];
        // Wavy wall guarding the channel entrance (bottom right)
        const wave = waveWall(330, 800, 530, 55, 1);

        // The course: 18 holes. Walls are polylines; funnels are hole 1's traps only.
        const HOLES = [
            { name: 'The Arch', par: 3, tee: { x: 200, y: 520 }, cup: { x: 610, y: 150 },
              funnels: [
                  { x: 610, y: 150, r: 75, cup: true },
                  { x: 610, y: 300, r: 75, cup: false },
                  { x: 610, y: 445, r: 75, cup: false }
              ],
              walls: [archLeft, divider, wave] },
            { name: 'Gate of Hades', par: 2, tee: { x: 100, y: 300 }, cup: { x: 700, y: 300 }, funnels: [],
              walls: [L(60, 200, 740, 200, 740, 400, 60, 400, 60, 200), L(400, 200, 400, 230), L(400, 280, 400, 400)] },
            { name: "Atlas' Pillar", par: 3, tee: { x: 120, y: 500 }, cup: { x: 680, y: 100 }, funnels: [],
              walls: [box(380, 240, 40, 120)] },
            { name: "Sisyphus' Fence", par: 3, tee: { x: 100, y: 120 }, cup: { x: 700, y: 500 }, funnels: [],
              walls: [L(80, 300, 560, 300)] },
            { name: 'Labyrinth', par: 4, tee: { x: 60, y: 540 }, cup: { x: 60, y: 60 }, funnels: [],
              walls: [L(0, 460, 620, 460), L(180, 300, 800, 300), L(0, 140, 620, 140)] },
            { name: 'The Sphinx', par: 3, tee: { x: 120, y: 300 }, cup: { x: 680, y: 300 }, funnels: [],
              walls: [L(330, 200, 470, 300, 330, 400, 330, 200)] },
            { name: "Theseus' Turn", par: 4, tee: { x: 80, y: 100 }, cup: { x: 720, y: 500 }, funnels: [],
              walls: [L(180, 0, 180, 420, 640, 420)] },
            { name: 'Icarus', par: 4, tee: { x: 100, y: 540 }, cup: { x: 700, y: 60 }, funnels: [],
              walls: [L(120, 400, 520, 400), L(280, 200, 680, 200)] },
            { name: 'Medusa', par: 3, tee: { x: 80, y: 300 }, cup: { x: 720, y: 300 }, funnels: [],
              walls: [box(200, 140, 50, 50), box(200, 410, 50, 50), box(400, 260, 60, 80), box(560, 140, 50, 50), box(560, 410, 50, 50)] },
            { name: "Ariadne's Ring", par: 4, tee: { x: 100, y: 300 }, cup: { x: 400, y: 300 }, funnels: [],
              walls: [arcPoints(400, 300, 200, 0.35, Math.PI * 2 - 0.35, 60)] },
            { name: 'Cross of Hermes', par: 3, tee: { x: 100, y: 300 }, cup: { x: 700, y: 300 }, funnels: [],
              walls: [L(380, 240, 420, 240, 420, 280, 460, 280, 460, 320, 420, 320, 420, 360, 380, 360, 380, 320, 340, 320, 340, 280, 380, 280, 380, 240)] },
            { name: "Charon's Channel", par: 3, tee: { x: 150, y: 300 }, cup: { x: 400, y: 300 }, funnels: [],
              walls: [L(300, 120, 300, 500), L(500, 120, 500, 500)] },
            { name: 'The Serpent', par: 4, tee: { x: 60, y: 500 }, cup: { x: 740, y: 100 }, funnels: [],
              walls: [waveWall(100, 700, 300, 90, 2)] },
            { name: 'Gauntlet', par: 4, tee: { x: 100, y: 300 }, cup: { x: 700, y: 300 }, funnels: [],
              walls: [L(250, 0, 250, 420), L(400, 180, 400, 600), L(550, 0, 550, 420)] },
            { name: 'Hydra', par: 4, tee: { x: 80, y: 300 }, cup: { x: 720, y: 300 }, funnels: [],
              walls: [box(200, 150, 60, 60), box(200, 390, 60, 60), box(480, 240, 80, 120)] },
            { name: 'Narrows of the Styx', par: 3, tee: { x: 60, y: 300 }, cup: { x: 740, y: 120 }, funnels: [],
              walls: [L(40, 340, 40, 260, 640, 260), L(40, 340, 640, 340)] },
            { name: 'The Colosseum', par: 4, tee: { x: 640, y: 380 }, cup: { x: 160, y: 220 }, funnels: [],
              walls: [arcPoints(400, 300, 280, -Math.PI + 0.4, Math.PI - 0.4, 80), box(360, 270, 80, 60)] },
            { name: 'Olympus', par: 5, tee: { x: 60, y: 60 }, cup: { x: 740, y: 540 }, funnels: [],
              walls: [box(330, 260, 60, 60), box(520, 380, 60, 60), box(200, 120, 60, 60), box(600, 180, 60, 60)] }
        ];

        // Current-hole geometry (reassigned by loadHole)
        let TEE = HOLES[0].tee;
        let walls = [];
        let segments = [];
        let funnels = [];

        function loadHole(i) {
            const h = HOLES[i];
            TEE = h.tee;
            walls = h.walls;
            funnels = h.funnels.map(f => ({ ...f }));
            segments = [];
            for (const poly of walls) {
                for (let k = 0; k < poly.length - 1; k++) segments.push([poly[k], poly[k + 1]]);
            }
            game.cup = { x: h.cup.x, y: h.cup.y, radius: 14 };
            game.ball = { x: TEE.x, y: TEE.y, vx: 0, vy: 0, radius: 8, friction: 0.98 };
            game.hole = i;
            game.strokes = 0;
            game.ballInHole = false;
            game.funnelEnter = null;
            game.isAiming = false;
            game.aimPos = null;
        }
        loadHole(0);

        // Circle vs segment collision, reflect velocity
        function collideSegments(b) {
            for (const [p, q] of segments) {
                const dx = q.x - p.x, dy = q.y - p.y;
                const len2 = dx * dx + dy * dy;
                let t = ((b.x - p.x) * dx + (b.y - p.y) * dy) / len2;
                t = Math.max(0, Math.min(1, t));
                const cx = p.x + t * dx, cy = p.y + t * dy;
                let nx = b.x - cx, ny = b.y - cy;
                const dist = Math.sqrt(nx * nx + ny * ny);
                if (dist < b.radius && dist > 0.0001) {
                    nx /= dist; ny /= dist;
                    // push out
                    b.x = cx + nx * b.radius;
                    b.y = cy + ny * b.radius;
                    // reflect
                    const dot = b.vx * nx + b.vy * ny;
                    if (dot < 0) {
                        b.vx -= 2 * dot * nx;
                        b.vy -= 2 * dot * ny;
                        b.vx *= 0.8;
                        b.vy *= 0.8;
                    }
                }
            }
        }

        // Physics
        function updatePhysics() {
            const b = game.ball;

            b.x += b.vx;
            b.y += b.vy;

            b.vx *= b.friction;
            b.vy *= b.friction;

            // Funnel gravity: pull toward center, stronger near the middle
            let inFunnel = null;
            for (const f of funnels) {
                const dx = f.x - b.x, dy = f.y - b.y;
                const d = Math.sqrt(dx * dx + dy * dy);
                if (d < f.r) {
                    inFunnel = f;
                    if (d > 1) {
                        const pull = 0.22 * (1 - d / f.r) + 0.05;
                        b.vx += (dx / d) * pull;
                        b.vy += (dy / d) * pull;
                    }
                }
            }

            // Settle: after 2s oscillating in a trap, damp hard and snap to center
            if (inFunnel && !inFunnel.cup) {
                if (!game.funnelEnter) game.funnelEnter = performance.now();
                if (performance.now() - game.funnelEnter > 2000) {
                    b.vx *= 0.85;
                    b.vy *= 0.85;
                    const dx = inFunnel.x - b.x, dy = inFunnel.y - b.y;
                    if (Math.abs(b.vx) < 1 && Math.abs(b.vy) < 1 && Math.sqrt(dx * dx + dy * dy) < 20) {
                        b.x = inFunnel.x; b.y = inFunnel.y;
                        b.vx = 0; b.vy = 0;
                    }
                }
            } else {
                game.funnelEnter = null;
            }

            collideSegments(b);

            // Canvas boundaries
            if (b.x - b.radius < 0) { b.x = b.radius; b.vx *= -0.8; }
            if (b.x + b.radius > canvas.width) { b.x = canvas.width - b.radius; b.vx *= -0.8; }
            if (b.y - b.radius < 0) { b.y = b.radius; b.vy *= -0.8; }
            if (b.y + b.radius > canvas.height) { b.y = canvas.height - b.radius; b.vy *= -0.8; }

            const speed = Math.sqrt(b.vx * b.vx + b.vy * b.vy);

            // Stop if nearly still (outside funnels — inside, the pull keeps it drifting to center)
            if (speed < 0.1) {
                b.vx = 0;
                b.vy = 0;
            }

            // Cup: only sinks if slow enough to drop
            const dx = b.x - game.cup.x;
            const dy = b.y - game.cup.y;
            if (Math.sqrt(dx * dx + dy * dy) < game.cup.radius && speed < 7) {
                game.ballInHole = true;
            }
        }

        function ballStopped() {
            return game.ball.vx === 0 && game.ball.vy === 0;
        }

        function scoreName(strokes, par) {
            const d = strokes - par;
            if (strokes === 1) return 'Hole in one';
            if (d <= -2) return 'Eagle';
            if (d === -1) return 'Birdie';
            if (d === 0) return 'Par';
            if (d === 1) return 'Bogey';
            if (d === 2) return 'Double bogey';
            return `+${d}`;
        }

        // Draw
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Funnels (diamond basins)
            for (const f of funnels) {
                ctx.fillStyle = f.cup ? 'rgba(60,120,60,0.45)' : 'rgba(60,110,60,0.35)';
                ctx.beginPath();
                ctx.moveTo(f.x, f.y - f.r);
                ctx.lineTo(f.x + f.r, f.y);
                ctx.lineTo(f.x, f.y + f.r);
                ctx.lineTo(f.x - f.r, f.y);
                ctx.closePath();
                ctx.fill();
                // inner shading toward the low point
                const grad = ctx.createRadialGradient(f.x, f.y, 4, f.x, f.y, f.r * 0.7);
                grad.addColorStop(0, 'rgba(0,40,0,0.35)');
                grad.addColorStop(1, 'rgba(0,40,0,0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.r * 0.7, 0, Math.PI * 2);
                ctx.fill();
                if (!f.cup) {
                    ctx.fillStyle = '#aab';
                    ctx.beginPath();
                    ctx.arc(f.x, f.y, 12, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Cup (blue)
            ctx.fillStyle = '#5ab4e8';
            ctx.beginPath();
            ctx.arc(game.cup.x, game.cup.y, game.cup.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(game.cup.x, game.cup.y, game.cup.radius * 0.55, 0, Math.PI * 2);
            ctx.fill();

            // Tee marker
            ctx.fillStyle = 'rgba(240,200,80,0.9)';
            ctx.beginPath();
            ctx.moveTo(TEE.x, TEE.y - 12);
            ctx.lineTo(TEE.x + 11, TEE.y + 8);
            ctx.lineTo(TEE.x - 11, TEE.y + 8);
            ctx.closePath();
            ctx.fill();

            // Walls
            ctx.strokeStyle = '#111';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            for (const poly of walls) {
                ctx.beginPath();
                ctx.moveTo(poly[0].x, poly[0].y);
                for (let i = 1; i < poly.length; i++) ctx.lineTo(poly[i].x, poly[i].y);
                ctx.stroke();
            }

            // Ball
            const b = game.ball;
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
            ctx.fill();

            // Slingshot aim: line opposite the drag + power dots
            if (game.isAiming && game.aimPos) {
                const dx = b.x - game.aimPos.x;
                const dy = b.y - game.aimPos.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const power = Math.min(dist / 10, game.maxPower);
                const angle = Math.atan2(dy, dx);

                // drag band (behind ball)
                ctx.strokeStyle = 'rgba(255,255,255,0.35)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(b.x, b.y);
                ctx.lineTo(game.aimPos.x, game.aimPos.y);
                ctx.stroke();

                // trajectory dots (in firing direction)
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                for (let i = 1; i <= 8; i++) {
                    const d = i * power * 1.8;
                    ctx.beginPath();
                    ctx.arc(b.x + Math.cos(angle) * d, b.y + Math.sin(angle) * d, 3 - i * 0.25, 0, Math.PI * 2);
                    ctx.fill();
                }

                // power bar
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.fillRect(b.x - 30, b.y - 34, 60, 8);
                ctx.fillStyle = power > game.maxPower * 0.85 ? '#e85a5a' : '#ffd94d';
                ctx.fillRect(b.x - 30, b.y - 34, 60 * (power / game.maxPower), 8);
            }

            // Hole finished overlay
            if (game.ballInHole) {
                const par = HOLES[game.hole].par;
                const last = game.hole === HOLES.length - 1;
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.textAlign = 'center';
                ctx.font = 'bold 40px Arial';
                if (!last) {
                    ctx.fillText(`🎉 ${scoreName(game.strokes, par)}! (${game.strokes})`, canvas.width / 2, canvas.height / 2);
                    ctx.font = '20px Arial';
                    ctx.fillText(`Click for hole ${game.hole + 2}`, canvas.width / 2, canvas.height / 2 + 50);
                } else {
                    const total = game.scores.reduce((a, s) => a + s, 0);
                    const totalPar = HOLES.reduce((a, h) => a + h.par, 0);
                    const diff = total - totalPar;
                    const diffText = diff === 0 ? 'Even par' : (diff > 0 ? `+${diff}` : `${diff}`);
                    ctx.fillText(`🏆 Course complete: ${total} (${diffText})`, canvas.width / 2, canvas.height / 2);
                    ctx.font = '20px Arial';
                    ctx.fillText('Click to play again', canvas.width / 2, canvas.height / 2 + 50);
                }
                ctx.textAlign = 'start';
            }

            document.getElementById('strokes').textContent = game.strokes;
            document.getElementById('hole').textContent = `${game.hole + 1} of ${HOLES.length} · ${HOLES[game.hole].name} · Par ${HOLES[game.hole].par}`;
            const vel = Math.sqrt(b.vx ** 2 + b.vy ** 2);
            document.getElementById('velocity').textContent = vel.toFixed(1);
        }

        function canvasPos(e) {
            const rect = canvas.getBoundingClientRect();
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }

        // Input — slingshot: press anywhere, drag back, release to fire opposite
        canvas.addEventListener('mousedown', (e) => {
            if (game.ballInHole) {
                if (game.hole < HOLES.length - 1) {
                    loadHole(game.hole + 1);
                } else {
                    game.scores = [];
                    loadHole(0);
                }
                return;
            }
            if (!ballStopped()) return;
            game.isAiming = true;
            game.aimPos = canvasPos(e);
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!game.isAiming) return;
            game.aimPos = canvasPos(e);
        });

        window.addEventListener('mouseup', (e) => {
            if (!game.isAiming || !game.aimPos) return;
            const b = game.ball;
            const pos = canvasPos(e);
            const dx = b.x - pos.x;
            const dy = b.y - pos.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            game.isAiming = false;

            if (dist < 5) return; // too small, treat as cancel

            const power = Math.min(dist / 10, game.maxPower);
            const angle = Math.atan2(dy, dx);
            b.vx = Math.cos(angle) * power;
            b.vy = Math.sin(angle) * power;
            game.strokes++;
        });

        // Game loop
        function gameLoop() {
            if (!game.ballInHole) {
                updatePhysics();
                if (game.ballInHole) game.scores[game.hole] = game.strokes;
            }
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
